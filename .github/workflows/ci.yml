name: LexiBite CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"

concurrency:
  group: lexibite-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  verify:
    name: Install / Typecheck / Lint / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate production artifacts
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint changed source
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git merge-base origin/main HEAD)"
          files="$(git diff --name-only "$base_sha" "$GITHUB_SHA" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs')"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            bunx eslint $files
          else
            echo "No changed source files require linting."
          fi

      - name: Unit and integration tests
        run: bun run test

      - name: Verify bundle origin
        run: bun run verify:bundle
