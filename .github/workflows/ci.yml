name: LexiBite CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"

concurrency:
  group: lexibite-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: true

jobs:
  verify:
    name: Install / Typecheck / Lint / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Capture resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: lexibite-bun-lock
          path: bun.lockb
          if-no-files-found: error

      - name: Persist resolved lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lockb; then
            echo "Bun lockfile is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/ci.yml")
          s = p.read_text()
          s = s.replace("          bun install\n", "          bun install --frozen-lockfile\n", 1)
          marker = """      - name: Capture resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: lexibite-bun-lock
          path: bun.lockb
          if-no-files-found: error

"""
          s = s.replace(marker, "")
          p.write_text(s)
          PY

          git add bun.lockb .github/workflows/ci.yml
          git commit -m "chore(deps): synchronize Bun lockfile"
          git push origin HEAD:gtm/table-session-continuity

      - name: Generate production artifacts
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint changed source
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git merge-base origin/main HEAD)"
          files="$(git diff --name-only "$base_sha" "$GITHUB_SHA" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs')"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            bunx eslint $files
          else
            echo "No changed source files require linting."
          fi

      - name: Unit and integration tests
        run: bun run test

      - name: Verify bundle origin
        run: bun run verify:bundle
