name: LexiBite CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"

concurrency:
  group: lexibite-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  verify:
    name: Install / Typecheck / Lint / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # No pnpm-lock.yaml is committed yet; dependency caching is intentionally disabled.

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate production artifacts
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit and integration tests
        run: pnpm run test

      - name: Verify bundle origin
        run: pnpm run verify:bundle
