name: LexiBite CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"

concurrency:
  group: lexibite-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: true

jobs:
  verify:
    name: Install / Typecheck / Lint / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # No pnpm-lock.yaml is committed yet; dependency caching is intentionally disabled.

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate production artifacts
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Auto-format release changes
        if: startsWith(github.ref, 'refs/heads/release/') || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git merge-base origin/main HEAD)"
          files="$(git diff --name-only "$base_sha" "$GITHUB_SHA" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs')"
          if [ -n "$files" ]; then
            pnpm exec eslint $files --fix
            if ! git diff --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add $files
              git commit -m "style: format release changes"
              target_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
              git push origin "HEAD:${target_branch}"
            fi
          fi

      - name: Lint changed source
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git merge-base origin/main HEAD)"
          files="$(git diff --name-only "$base_sha" "$GITHUB_SHA" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs')"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            pnpm exec eslint $files
          else
            echo "No changed source files require linting."
          fi

      - name: Unit and integration tests
        run: pnpm run test

      - name: Verify bundle origin
        run: pnpm run verify:bundle
