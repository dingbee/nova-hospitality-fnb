name: LexiBite CI
# Phase 3 cost-intelligence acceptance is additionally enforced by phase3-hybrid-allocation.yml.

on:
  push:
    branches:
      - main
      - "wce/**"
      - "release/**"
      - "feat/operational-cost-intelligence-phase3-workaround"
      - "feat/operational-profitability-phase5"
      - "integration/phase2-phase5-release-certification"
  pull_request:
    branches:
      - main
      - "release/**"
      - "wce/**"

concurrency:
  group: lexibite-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  verify:
    name: Install / Typecheck / Lint / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lexibite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lexibite_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Clean replay of the complete canonical migration inventory
        env:
          NOVA_DB_HOST: localhost
          NOVA_DB_PORT: 5432
          NOVA_DB_NAME: lexibite_migration_replay
          NOVA_DB_SUPERUSER: postgres
          NOVA_DB_SUPERUSER_PASSWORD: postgres
          NOVA_DB_AUTHENTICATOR: nova_authenticator
          NOVA_DB_AUTHENTICATOR_PASSWORD: migration-replay-test-only
          PGSSLMODE: disable
          PGPASSWORD: postgres
        run: |
          bash local/scripts/init-db.sh
          psql -h localhost -U postgres -d lexibite_migration_replay -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM nova_local.schema_migrations WHERE filename = '0120_lb02zz_dispatch_cron_schedule.sql') THEN
              RAISE EXCEPTION 'LB-02 cron schedule was not replayed';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM cron.job WHERE jobname = 'lexibite-lb02-outbox-dispatch' AND active = false) THEN
              RAISE EXCEPTION 'Local cron compatibility schedule must be recorded inactive';
            END IF;
            IF to_regclass('public.api_integrations') IS NULL
              OR to_regclass('public.lb02_inbox_events') IS NULL
              OR to_regclass('public.lb03_pos_room_charge_operations') IS NULL
              OR to_regclass('public.restaurant_operational_profitability_snapshots') IS NULL THEN
              RAISE EXCEPTION 'Expected integration / inbox / POS ledger / profitability objects are missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public'
                AND p.proname = 'lb03_reject_pos_room_charge_audit_mutation'
            ) THEN
              RAISE EXCEPTION 'LB-03 audit immutability trigger function is missing';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public'
                AND c.relkind IN ('r', 'p')
                AND c.relrowsecurity = false
            ) THEN
              RAISE EXCEPTION 'A public application table is missing row-level security';
            END IF;
            IF (
              SELECT count(*)
              FROM pg_policies
              WHERE schemaname = 'public'
                AND tablename = 'restaurant_member_station_assignments'
                AND policyname IN (
                  'member station assignments insert',
                  'member station assignments update',
                  'member station assignments delete'
                )
            ) <> 3 OR EXISTS (
              SELECT 1
              FROM pg_policies
              WHERE schemaname = 'public'
                AND tablename = 'restaurant_member_station_assignments'
                AND policyname = 'member station assignments write'
            ) THEN
              RAISE EXCEPTION 'Station assignment write policies do not match the least-privilege split';
            END IF;
            IF has_function_privilege('anon', 'public.lb03_reject_pos_room_charge_audit_mutation()', 'EXECUTE')
              OR has_function_privilege('authenticated', 'public.lb03_reject_pos_room_charge_audit_mutation()', 'EXECUTE')
              OR has_function_privilege('service_role', 'public.lb03_reject_pos_room_charge_audit_mutation()', 'EXECUTE') THEN
              RAISE EXCEPTION 'LB-03 audit trigger function has direct EXECUTE grants';
            END IF;
            IF to_regprocedure('public.restaurant_bootstrap_owner_pos_pin(uuid,uuid,text)') IS NOT NULL THEN
              RAISE EXCEPTION 'Temporary owner POS PIN recovery function was not removed';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM cron.job
              WHERE jobname = 'lexibite-wa-webhook-dispatch' AND active = false
            ) THEN
              RAISE EXCEPTION 'WhatsApp webhook dispatcher schedule is missing or active in isolated replay';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM public.api_channel_definitions
              WHERE key = 'whatsapp' AND provider_key = 'meta-whatsapp' AND category = 'messaging'
            ) THEN
              RAISE EXCEPTION 'WhatsApp messaging channel definition is missing';
            END IF;
            IF has_function_privilege('anon', 'public.wa_claim_webhook_events(integer,integer,text)', 'EXECUTE')
              OR has_function_privilege('authenticated', 'public.wa_claim_webhook_events(integer,integer,text)', 'EXECUTE')
              OR has_function_privilege('anon', 'public.restaurant_resolve_guest_commerce_session(text)', 'EXECUTE')
              OR has_function_privilege('authenticated', 'public.restaurant_resolve_guest_commerce_session(text)', 'EXECUTE')
              OR has_function_privilege('anon', 'public.wa_apply_message_delivery_status(text,text,timestamptz,text)', 'EXECUTE')
              OR has_function_privilege('authenticated', 'public.wa_apply_message_delivery_status(text,text,timestamptz,text)', 'EXECUTE') THEN
              RAISE EXCEPTION 'WhatsApp service-only RPC privilege boundary is incorrect';
            END IF;
            IF EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public'
                AND tablename IN ('wa_webhook_events', 'restaurant_guest_commerce_sessions')
            ) THEN
              RAISE EXCEPTION 'Private WhatsApp inbox/session tables must not have authenticated policies';
            END IF;
            IF to_regclass('public.wa_guest_portal_sessions') IS NOT NULL
              OR to_regclass('public.restaurant_guest_commerce_sessions') IS NULL
              OR NOT EXISTS (
                SELECT 1 FROM pg_class
                WHERE oid = 'public.restaurant_guest_commerce_sessions'::regclass AND relrowsecurity
              )
              OR to_regclass('public.wa_outbound_jobs') IS NULL
              OR NOT EXISTS (
                SELECT 1 FROM pg_class
                WHERE oid = 'public.wa_outbound_jobs'::regclass AND relrowsecurity
              ) THEN
              RAISE EXCEPTION 'Unified guest commerce sessions or encrypted WhatsApp outbound queue are missing or RLS-disabled';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'restaurant_orders'
                AND column_name = 'guest_commerce_session_id'
            ) OR NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'restaurant_orders'
                AND column_name = 'guest_commerce_channel'
            ) THEN
              RAISE EXCEPTION 'Restaurant orders are not linked to the unified guest commerce session';
            END IF;
            IF has_function_privilege('anon', 'public.wa_claim_outbound_jobs(integer,integer,text)', 'EXECUTE')
              OR has_function_privilege('authenticated', 'public.wa_claim_outbound_jobs(integer,integer,text)', 'EXECUTE')
              OR EXISTS (
                SELECT 1 FROM pg_policies
                WHERE schemaname = 'public' AND tablename = 'wa_outbound_jobs'
              ) THEN
              RAISE EXCEPTION 'WhatsApp outbound queue must remain service-role only';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'wa_messages'
                AND column_name = 'outbound_job_id'
            ) THEN
              RAISE EXCEPTION 'WhatsApp outbound message linkage is missing';
            END IF;
          END $verify$;
          SELECT count(*) FILTER (WHERE status = 'applied') AS applied_migrations,
                 count(*) FILTER (WHERE status = 'skipped') AS policy_skipped_migrations
          FROM nova_local.schema_migrations;
          SELECT count(*) AS public_table_count,
                 count(*) FILTER (WHERE relrowsecurity) AS public_tables_with_rls
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public' AND c.relkind IN ('r', 'p');
          SQL

      - name: Verify WCE-04 session and RPC isolation in clean PostgreSQL replay
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d lexibite_migration_replay -v ON_ERROR_STOP=1 -f standalone/db/verification/test-wce04-unified-guest-commerce.sql

      - name: Generate production artifacts
        run: bun run build

      - name: Typecheck (strict repository gate)
        run: bun run typecheck

      - name: Lint changed source (blocking semantic gate)
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git merge-base origin/main HEAD)"
          files="$(git diff --name-only "$base_sha" "$GITHUB_SHA" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs')"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            bunx eslint --rule 'prettier/prettier: off' $files
          else
            echo "No changed source files require linting."
          fi

      - name: Verify service-recovery quantity migration in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d lexibite_test -v ON_ERROR_STOP=1 -f standalone/db/verification/test-service-recovery-affected-quantity-migration.sql

      - name: Verify authorised comp migration in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d lexibite_test -v ON_ERROR_STOP=1 -f standalone/db/verification/test-service-recovery-authorized-comp-migration.sql

      - name: Verify property/location integrity migration in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d lexibite_test -v ON_ERROR_STOP=1 -f standalone/db/verification/test-property-location-integrity-migration.sql

      - name: Verify tenant central-store migration in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d lexibite_test -v ON_ERROR_STOP=1 -f standalone/db/verification/test-tenant-central-store-migration.sql

      - name: Apply and verify the complete LexiBite LB-02 migration chain
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d lexibite_test -v ON_ERROR_STOP=1 -f standalone/db/verification/test-lb02-event-inbox.sql

      - name: Apply and verify the LexiBite LB-03 POS room-charge ledger
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d lexibite_test -v ON_ERROR_STOP=1 -f standalone/db/verification/test-lb03-pos-room-charge-ledger.sql

      - name: Verify Phase 3 hybrid allocation and operational expense lifecycle in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres lexibite_phase3_test
          psql -h localhost -U postgres -d lexibite_phase3_test -v ON_ERROR_STOP=1 -f standalone/db/verification/test-operational-cost-intelligence.sql
          bunx vitest run src/modules/restaurant/costing/hybrid-allocation.test.ts src/modules/restaurant/costing/profitability.server.test.ts

      - name: Scoped GTM and changed-path functional tests
        run: |
          bunx vitest run \
            src/modules/restaurant/core/members.server.test.ts \
            src/modules/api-platform/channel-registry.test.ts \
            src/modules/messaging/providers/meta-cloud-api.server.test.ts \
            src/modules/messaging/providers/meta-onboarding.server.test.ts \
            src/modules/messaging/embedded-signup.test.ts \
            src/modules/messaging/webhooks.server.test.ts \
            src/modules/messaging/bindings.server.test.ts \
            src/modules/messaging/webhook-queue.server.test.ts \
            src/modules/messaging/guest-portal-sessions.server.test.ts \
            src/modules/messaging/handoff.server.test.ts \
            src/modules/messaging/outbound-queue.server.test.ts \
            src/modules/restaurant/selforder/whatsapp-guest-portal.server.test.ts \
            src/modules/restaurant/guest-commerce/orders.server.test.ts \
            src/modules/api-platform/adapters/meta-whatsapp.server.test.ts \
            src/modules/api-platform/adapters/channel-adapter.test.ts \
            src/modules/restaurant/payments/mobilemoney/mobilemoney.server.test.ts \
            src/modules/restaurant/payments/mobilemoney/mobilemoney.property-scope.test.ts \
            src/modules/restaurant/payments/mobilemoney/providers/payinAdapter.server.test.ts \
            src/modules/restaurant/receipts/delivery.server.test.ts \
            src/modules/restaurant/bar/bar.test.ts \
            src/modules/restaurant/bar/ticket-items.test.ts \
            src/modules/restaurant/sales/service-recovery.contracts.test.ts \
            src/modules/restaurant/ui/useRestaurantWorkspace.test.ts \
            src/modules/restaurant/inventory/locations.server.test.ts

      - name: Full test suite (repository blocking gate)
        run: bun run test

      - name: Verify Phase 1 operational consumables ledger capture and RLS
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres lexibite_consumables_test
          psql -h localhost -U postgres -d lexibite_consumables_test -v ON_ERROR_STOP=1 -f standalone/db/verification/test-operational-consumables-phase1.sql

      - name: Verify Phase 1 per-cover operational consumption service
        run: bunx vitest run src/modules/restaurant/inventory/movements.server.test.ts

      - name: Verify pinned recipe consumption cost idempotency and currency integrity
        run: bunx vitest run src/modules/restaurant/products/consumption.server.test.ts

      - name: Verify operational profitability calculation contract
        run: bunx vitest run src/modules/restaurant/costing/operational-profitability.calculation.test.ts

      - name: Verify operational profitability snapshot schema and RLS
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres lexibite_profitability_test
          psql -h localhost -U postgres -d lexibite_profitability_test -v ON_ERROR_STOP=1 -f standalone/db/verification/test-operational-profitability-snapshots.sql

      - name: Verify bundle origin
        run: bun run verify:bundle -- .output
