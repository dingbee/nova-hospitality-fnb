name: LexiBite CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"

concurrency:
  group: lexibite-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: true

jobs:
  verify:
    name: Install / Typecheck / Lint / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lexibite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lexibite_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # One-time formatting cleanup for this P0 closure branch. This step is
      # removed after the formatting commit so ordinary CI stays read-only.
      - name: Format changed source for P0 closure
        if: github.head_ref == 'fix/procurement-integrity-followthrough'
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git merge-base origin/main HEAD)"
          files="$(git diff --name-only "$base_sha" "$GITHUB_SHA" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs')"
          if [ -n "$files" ]; then
            printf '%s\\n' "$files"
            bunx prettier --write $files
            if ! git diff --quiet -- $files; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -- $files
              git commit -m "style: format changed source for clean CI"
              git push origin "HEAD:$GITHUB_HEAD_REF"
            fi
          fi

      - name: Generate production artifacts
        run: bun run build

      - name: Typecheck (repository baseline)
        id: typecheck
        continue-on-error: true
        run: bun run typecheck

      - name: Report typecheck baseline
        if: steps.typecheck.outcome == 'failure'
        run: |
          echo "::warning::Repository-wide TypeScript baseline is currently non-clean. Build and scoped functional gates remain blocking."

      - name: Lint changed source
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git merge-base origin/main HEAD)"
          files="$(git diff --name-only "$base_sha" "$GITHUB_SHA" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs')"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            bunx eslint $files
          else
            echo "No changed source files require linting."
          fi

      - name: Report lint baseline
        if: steps.lint.outcome == 'failure'
        run: echo "::warning::Changed-source lint has existing formatting debt; scoped functional test and build gates remain blocking."

      - name: Verify service-recovery quantity migration in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d lexibite_test -v ON_ERROR_STOP=1 -f standalone/db/verification/test-service-recovery-affected-quantity-migration.sql

      - name: Verify authorised comp migration in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d lexibite_test -v ON_ERROR_STOP=1 -f standalone/db/verification/test-service-recovery-authorized-comp-migration.sql

      - name: Verify property/location integrity migration in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d lexibite_test -v ON_ERROR_STOP=1 -f standalone/db/verification/test-property-location-integrity-migration.sql

      - name: Verify tenant central-store scope and activation migrations in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d lexibite_test -v ON_ERROR_STOP=1 -f standalone/db/verification/test-tenant-central-store-migration.sql

      - name: Scoped GTM and changed-path functional tests
        run: |
          bunx vitest run \
            src/modules/restaurant/core/members.server.test.ts \
            src/modules/api-platform/channel-registry.test.ts \
            src/modules/api-platform/adapters/channel-adapter.test.ts \
            src/modules/restaurant/payments/mobilemoney/mobilemoney.server.test.ts \
            src/modules/restaurant/payments/mobilemoney/mobilemoney.property-scope.test.ts \
            src/modules/restaurant/payments/mobilemoney/providers/payinAdapter.server.test.ts \
            src/modules/restaurant/receipts/delivery.server.test.ts \
            src/modules/restaurant/bar/bar.test.ts \
            src/modules/restaurant/bar/ticket-items.test.ts \
            src/modules/restaurant/sales/service-recovery.contracts.test.ts \
            src/modules/restaurant/ui/useRestaurantWorkspace.test.ts \
            src/modules/restaurant/inventory/locations.server.test.ts \
            src/modules/restaurant/intelligence/purchasing.server.test.ts \
            src/modules/restaurant/procurement/ask-lexibite.server.test.ts \
            src/modules/restaurant/procurement/receiving-governance.test.ts \
            src/modules/restaurant/procurement/receiving-units.test.ts

      - name: Full test suite (repository baseline)
        id: full_tests
        continue-on-error: true
        run: bun run test

      - name: Report full test baseline
        if: steps.full_tests.outcome == 'failure'
        run: echo "::warning::Full repository test suite remains non-clean; scoped procurement and changed-path functional gate passed, while unrelated baseline failures remain."

      - name: Verify bundle origin
        run: bun run verify:bundle -- .output

      - name: Enforce clean repository-wide quality gates
        if: always()
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          FULL_TESTS_OUTCOME: ${{ steps.full_tests.outcome }}
        run: |
          failed=0
          for gate in TYPECHECK LINT FULL_TESTS; do
            var="${gate}_OUTCOME"
            outcome="${!var}"
            if [ "$outcome" != "success" ]; then
              echo "::error::$gate gate did not pass (outcome: $outcome)."
              failed=1
            fi
          done
          exit "$failed"
