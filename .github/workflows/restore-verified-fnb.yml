name: Restore verified standalone F&B

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: !startsWith(github.event.head_commit.message, 'Restore verified standalone NOVA Hospitality F&B')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch verified standalone source
        run: |
          set -euo pipefail
          rm -rf /tmp/mtoni-source
          git clone --filter=blob:none --no-checkout https://github.com/dingbee/mtoni-river-lodge.git /tmp/mtoni-source
          cd /tmp/mtoni-source
          git fetch --depth 1 origin b092431a3c2d4dca4b4aaa72a3839b6ae273d5e2
          git checkout --detach b092431a3c2d4dca4b4aaa72a3839b6ae273d5e2
          test -f export/nova-fnb/README.md
          test -f export/nova-fnb/package.json
          test -f export/nova-fnb/src/lib/independence.test.ts

      - name: Replace repository with verified F&B source
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/mtoni-source/export/nova-fnb/. .
          test -f package.json
          test -f src/lib/independence.test.ts
          test ! -d src/routes

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Full test suite
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Remove one-time restore workflow
        run: rm -f .github/workflows/restore-verified-fnb.yml

      - name: Commit verified standalone product
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore verified standalone NOVA Hospitality F&B'
          git push origin main
