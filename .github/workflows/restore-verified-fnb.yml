name: Restore standalone NOVA Hospitality F&B

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.event.head_commit.message != 'Install complete standalone NOVA Hospitality F&B'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch verified standalone source
        run: |
          set -euo pipefail
          rm -rf /tmp/mtoni /tmp/source
          git clone --depth 1 https://github.com/dingbee/mtoni-river-lodge.git /tmp/mtoni
          test -d /tmp/mtoni/export/nova-fnb/src/modules/restaurant
          test -d /tmp/mtoni/export/nova-fnb/local
          test -d /tmp/mtoni/export/nova-fnb/standalone
          test -f /tmp/mtoni/export/nova-fnb/docs/security-uat-gate.md
          cp -a /tmp/mtoni/export/nova-fnb /tmp/source

      - name: Replace scaffold with standalone product
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/source/. .
          test -f package.json
          test -d src/modules/restaurant
          test -d src/modules/intelligence
          test -d local
          test -d standalone
          test -d docs
          test ! -d src/domains/content
          test ! -f src/lib/booking.functions.ts

      - name: Commit complete product
        run: |
          set -euo pipefail
          git config user.name 'dingbee'
          git config user.email 'engutoto@googlemail.com'
          git add -A
          git commit -m 'Install complete standalone NOVA Hospitality F&B'
          git push origin main
