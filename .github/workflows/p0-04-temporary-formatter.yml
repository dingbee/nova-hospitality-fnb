name: P0-04 Temporary Formatter

on:
  push:
    branches:
      - feature/p0-04-central-store-authorization

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format changed P0-04 files and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only origin/main...HEAD | grep -E '\\.(ts|tsx|js|jsx|json|md|yml|yaml)$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No formattable files changed."
            exit 0
          fi
          bunx prettier --write "${files[@]}"
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style(p0-04): apply repository formatting"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
