name: LexiBite WCE Verification

on:
  push:
    branches:
      - "wce/wce-02-messaging-sessions"
  pull_request:
    branches:
      - "wce/wce-02-messaging-sessions"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lexibite-wce-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: WCE typecheck / lint / tests / build / migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lexibite_wce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lexibite_wce"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install
      - name: Changed-source lint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin wce/wce-02-messaging-sessions
          files="$(git diff --name-only origin/wce/wce-02-messaging-sessions...HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs')"
          if [ -n "$files" ]; then bunx eslint $files; fi
      - name: WCE tests
        run: >-
          bunx vitest run
          src/modules/messaging/providers/meta-cloud-api.server.test.ts
          src/modules/messaging/providers/meta-onboarding.server.test.ts
          src/modules/messaging/embedded-signup.test.ts
          src/modules/messaging/webhooks.server.test.ts
          src/modules/messaging/bindings.server.test.ts
          src/modules/messaging/webhook-queue.server.test.ts
          src/modules/messaging/guest-portal-sessions.server.test.ts
      - name: Full repository tests
        run: bun run test
      - name: Strict typecheck
        run: bun run typecheck
      - name: Production build and route generation
        run: bun run build
      - name: PostgreSQL 17 clean migration replay
        env:
          NOVA_DB_HOST: 127.0.0.1
          NOVA_DB_PORT: 5432
          NOVA_DB_NAME: lexibite_wce_replay
          NOVA_DB_SUPERUSER: postgres
          NOVA_DB_SUPERUSER_PASSWORD: postgres
          NOVA_DB_AUTHENTICATOR: nova_authenticator
          NOVA_DB_AUTHENTICATOR_PASSWORD: wce-ci-only-authenticator-password
        run: |
          ./local/scripts/init-db.sh
          ./local/scripts/apply-migrations.sh
          PGPASSWORD="$NOVA_DB_SUPERUSER_PASSWORD" psql -X -h "$NOVA_DB_HOST" -p "$NOVA_DB_PORT" -U "$NOVA_DB_SUPERUSER" -d "$NOVA_DB_NAME" -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE
            table_name text;
            table_names text[] := ARRAY[
              'wa_phone_number_bindings',
              'wa_webhook_events',
              'wa_conversations',
              'wa_messages',
              'wa_guest_portal_sessions'
            ];
          BEGIN
            FOREACH table_name IN ARRAY table_names LOOP
              IF to_regclass(format('public.%I', table_name)) IS NULL THEN
                RAISE EXCEPTION 'WCE-02 required table is missing: %', table_name;
              END IF;
              IF NOT (
                SELECT c.relrowsecurity
                FROM pg_class c
                WHERE c.oid = to_regclass(format('public.%I', table_name))
              ) THEN
                RAISE EXCEPTION 'WCE-02 table has RLS disabled: %', table_name;
              END IF;
            END LOOP;

            IF NOT EXISTS (
              SELECT 1
              FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public'
                AND p.proname = 'wa_claim_webhook_events'
                AND p.prosecdef
                AND 'search_path=public, pg_temp' = ANY (p.proconfig)
            ) THEN
              RAISE EXCEPTION 'Webhook claim RPC is missing or lacks a fixed search path';
            END IF;

            IF has_function_privilege('anon', 'public.wa_claim_webhook_events(integer,integer,text)', 'EXECUTE')
              OR has_function_privilege('authenticated', 'public.wa_claim_webhook_events(integer,integer,text)', 'EXECUTE')
              OR NOT has_function_privilege('service_role', 'public.wa_claim_webhook_events(integer,integer,text)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Webhook claim RPC grants are not service-role-only';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public' AND tablename = 'wa_conversations'
                AND policyname = 'wa_conversations_read_scoped'
            ) OR NOT EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public' AND tablename = 'wa_messages'
                AND policyname = 'wa_messages_read_scoped'
            ) OR NOT EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public' AND tablename = 'wa_phone_number_bindings'
                AND policyname = 'wa_phone_bindings_read_scoped'
            ) THEN
              RAISE EXCEPTION 'WCE-02 tenant-scoped read policies are missing';
            END IF;
          END $verify$;
          SQL
