name: LexiBite WCE Verification

on:
  push:
    branches:
      - "wce/wce-02-messaging-sessions"
      - "wce/wce-03-08-stack"
      - "wce/wce-06-campaign-commercial-controls"
      - "wce/wce-07-operations-analytics"
      - "wce/wce-08-integrated-certification"
  pull_request:
    branches:
      - "wce/wce-02-messaging-sessions"
      - "wce/wce-03-08-stack"
      - "wce/wce-06-campaign-commercial-controls"
      - "wce/wce-07-operations-analytics"
      - "wce/wce-08-integrated-certification"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lexibite-wce-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: WCE typecheck / lint / tests / build / migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lexibite_wce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lexibite_wce"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install
      - name: Changed-source lint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin wce/wce-02-messaging-sessions
          files="$(git diff --name-only origin/wce/wce-02-messaging-sessions...HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs')"
          if [ -n "$files" ]; then
            bunx eslint $files
          fi
      - name: WCE tests
        shell: bash
        run: |
          set -euo pipefail
          test_files=(
            src/modules/messaging/providers/meta-cloud-api.server.test.ts
            src/modules/messaging/providers/meta-onboarding.server.test.ts
            src/modules/messaging/embedded-signup.test.ts
            src/modules/messaging/webhooks.server.test.ts
            src/modules/messaging/bindings.server.test.ts
            src/modules/messaging/webhook-queue.server.test.ts
            src/modules/messaging/guest-portal-sessions.server.test.ts
            src/modules/messaging/guest-commerce.server.test.ts
            src/modules/messaging/guest-crm.server.test.ts
            src/modules/messaging/outbound-queue.server.test.ts
            src/modules/messaging/guest-reservations.server.test.ts
            src/modules/messaging/campaign-governance.server.test.ts
            src/modules/messaging/operations.server.test.ts
            src/modules/restaurant/selforder/providers/pesapal.server.test.ts
            src/modules/restaurant/selforder/selfpay.server.test.ts
            src/modules/restaurant/selforder/selfpay.concurrency.test.ts
            src/modules/restaurant/selforder/selfpay.integration.test.ts
            src/modules/restaurant/menu/availability.server.test.ts
            src/modules/api-platform/adapters/meta-whatsapp.server.test.ts
          )
          existing_tests=()
          for test_file in "${test_files[@]}"; do
            if [ -f "$test_file" ]; then
              existing_tests+=("$test_file")
            fi
          done
          if [ "${#existing_tests[@]}" -eq 0 ]; then
            echo "No WCE tests found on this branch"
            exit 1
          fi
          bunx vitest run "${existing_tests[@]}"
      - name: Full repository tests
        run: bun run test
      - name: Strict typecheck
        run: bun run typecheck
      - name: Production build and route generation
        run: bun run build
      - name: PostgreSQL 17 clean migration replay
        env:
          NOVA_DB_HOST: 127.0.0.1
          NOVA_DB_PORT: 5432
          NOVA_DB_NAME: lexibite_wce_replay
          NOVA_DB_SUPERUSER: postgres
          NOVA_DB_SUPERUSER_PASSWORD: postgres
          NOVA_DB_AUTHENTICATOR: nova_authenticator
          NOVA_DB_AUTHENTICATOR_PASSWORD: wce-ci-only-authenticator-password
        run: |
          set -euo pipefail
          ./local/scripts/init-db.sh
          ./local/scripts/apply-migrations.sh
          PGPASSWORD="$NOVA_DB_SUPERUSER_PASSWORD" psql -X -h "$NOVA_DB_HOST" -p "$NOVA_DB_PORT" -U "$NOVA_DB_SUPERUSER" -d "$NOVA_DB_NAME" -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE
            table_name text;
            wce02_tables text[] := ARRAY[
              'wa_phone_number_bindings',
              'wa_webhook_events',
              'wa_conversations',
              'wa_messages',
              'wa_guest_portal_sessions'
            ];
            wce06_tables text[] := ARRAY[
              'wa_message_templates',
              'wa_campaigns',
              'wa_campaign_recipients',
              'wa_meta_message_rates',
              'wa_campaign_usage_ledger'
            ];
          BEGIN
            FOREACH table_name IN ARRAY wce02_tables LOOP
              IF to_regclass(format('public.%I', table_name)) IS NULL THEN
                RAISE EXCEPTION 'WCE-02 required table is missing: %', table_name;
              END IF;
              IF NOT (
                SELECT c.relrowsecurity
                FROM pg_class c
                WHERE c.oid = to_regclass(format('public.%I', table_name))
              ) THEN
                RAISE EXCEPTION 'WCE-02 table has RLS disabled: %', table_name;
              END IF;
            END LOOP;

            IF NOT EXISTS (
              SELECT 1
              FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public'
                AND p.proname = 'wa_claim_webhook_events'
                AND p.prosecdef
                AND 'search_path=public, pg_temp' = ANY (p.proconfig)
            ) THEN
              RAISE EXCEPTION 'Webhook claim RPC is missing or lacks a fixed search path';
            END IF;

            IF has_function_privilege('anon', 'public.wa_claim_webhook_events(integer,integer,text)', 'EXECUTE')
              OR has_function_privilege('authenticated', 'public.wa_claim_webhook_events(integer,integer,text)', 'EXECUTE')
              OR NOT has_function_privilege('service_role', 'public.wa_claim_webhook_events(integer,integer,text)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Webhook claim RPC grants are not service-role-only';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public' AND tablename = 'wa_conversations'
                AND policyname = 'wa_conversations_read_scoped'
            ) OR NOT EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public' AND tablename = 'wa_messages'
                AND policyname = 'wa_messages_read_scoped'
            ) OR NOT EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public' AND tablename = 'wa_phone_number_bindings'
                AND policyname = 'wa_phone_bindings_read_scoped'
            ) THEN
              RAISE EXCEPTION 'WCE-02 tenant-scoped read policies are missing';
            END IF;

            IF EXISTS (
              SELECT 1 FROM pg_attribute
              WHERE attrelid = 'public.wa_messages'::regclass
                AND attname = 'client_request_id'
                AND NOT attisdropped
            ) THEN
              IF (SELECT attnotnull FROM pg_attribute WHERE attrelid = 'public.wa_messages'::regclass AND attname = 'provider_message_id') THEN
                RAISE EXCEPTION 'Outbound message ledger still requires provider ID before send';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
                WHERE n.nspname = 'public' AND p.proname = 'wa_claim_outbound_messages'
                  AND p.prosecdef AND 'search_path=public, pg_temp' = ANY (p.proconfig)
              ) THEN
                RAISE EXCEPTION 'Outbound claim RPC is missing or lacks a fixed search path';
              END IF;
              IF has_function_privilege('anon', 'public.wa_claim_outbound_messages(integer,integer,text)', 'EXECUTE')
                OR has_function_privilege('authenticated', 'public.wa_claim_outbound_messages(integer,integer,text)', 'EXECUTE')
                OR NOT has_function_privilege('service_role', 'public.wa_claim_outbound_messages(integer,integer,text)', 'EXECUTE') THEN
                RAISE EXCEPTION 'Outbound claim RPC grants are not service-role-only';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM pg_indexes
                WHERE schemaname = 'public' AND tablename = 'wa_messages'
                  AND indexname = 'wa_messages_outbound_request_uq'
              ) THEN
                RAISE EXCEPTION 'Outbound idempotency unique index is missing';
              END IF;
            END IF;

            FOREACH table_name IN ARRAY ARRAY[
              'restaurant_guest_customers',
              'restaurant_guest_customer_consents'
            ] LOOP
              IF to_regclass(format('public.%I', table_name)) IS NOT NULL
                AND NOT (
                  SELECT c.relrowsecurity
                  FROM pg_class c
                  WHERE c.oid = to_regclass(format('public.%I', table_name))
                ) THEN
                RAISE EXCEPTION 'Guest CRM/consent table has RLS disabled: %', table_name;
              END IF;
            END LOOP;

            IF to_regclass('public.wa_campaigns') IS NOT NULL THEN
              FOREACH table_name IN ARRAY wce06_tables LOOP
                IF to_regclass(format('public.%I', table_name)) IS NULL THEN
                  RAISE EXCEPTION 'WCE-06 required table is missing: %', table_name;
                END IF;
                IF NOT (
                  SELECT c.relrowsecurity
                  FROM pg_class c
                  WHERE c.oid = to_regclass(format('public.%I', table_name))
                ) THEN
                  RAISE EXCEPTION 'WCE-06 table has RLS disabled: %', table_name;
                END IF;
              END LOOP;

              IF NOT EXISTS (
                SELECT 1 FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
                WHERE n.nspname = 'public' AND p.proname = 'wa_campaign_usage_ledger_immutable'
                  AND p.prosecdef AND 'search_path=public, pg_temp' = ANY (p.proconfig)
              ) THEN
                RAISE EXCEPTION 'WCE-06 immutable usage evidence trigger function missing or unsafe';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
                WHERE n.nspname = 'public' AND p.proname = 'wa_prepare_campaign_recipient'
                  AND p.prosecdef AND 'search_path=public, pg_temp' = ANY (p.proconfig)
              ) THEN
                RAISE EXCEPTION 'WCE-06 atomic recipient preparation RPC missing or unsafe';
              END IF;
              IF has_function_privilege('anon', 'public.wa_prepare_campaign_recipient(uuid,uuid,uuid,uuid,text,text,text)', 'EXECUTE')
                OR has_function_privilege('authenticated', 'public.wa_prepare_campaign_recipient(uuid,uuid,uuid,uuid,text,text,text)', 'EXECUTE')
                OR NOT has_function_privilege('service_role', 'public.wa_prepare_campaign_recipient(uuid,uuid,uuid,uuid,text,text,text)', 'EXECUTE') THEN
                RAISE EXCEPTION 'WCE-06 recipient preparation RPC grants are not service-role-only';
              END IF;
              IF position('auth.role()' IN pg_get_functiondef(
                'public.restaurant_increment_quota_usage(uuid,uuid,uuid,timestamptz,timestamptz,integer,text)'::regprocedure
              )) = 0 OR position('service_role' IN pg_get_functiondef(
                'public.restaurant_increment_quota_usage(uuid,uuid,uuid,timestamptz,timestamptz,integer,text)'::regprocedure
              )) = 0 THEN
                RAISE EXCEPTION 'WCE-06 service-role quota accounting path is not enabled';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM pg_attribute
                WHERE attrelid = 'public.wa_campaign_recipients'::regclass
                  AND attname = 'source_event_key'
                  AND NOT attisdropped
              ) OR EXISTS (
                SELECT 1 FROM pg_constraint
                WHERE conrelid = 'public.wa_campaign_recipients'::regclass
                  AND conname = 'wa_campaign_recipients_campaign_guest_uq'
              ) THEN
                RAISE EXCEPTION 'WCE event recipient idempotency is not keyed by source event';
              END IF;

              IF has_table_privilege('anon', 'public.wa_meta_message_rates', 'SELECT')
                OR has_table_privilege('authenticated', 'public.wa_meta_message_rates', 'SELECT')
                OR has_table_privilege('anon', 'public.wa_meta_message_rates', 'INSERT')
                OR has_table_privilege('authenticated', 'public.wa_meta_message_rates', 'INSERT') THEN
                RAISE EXCEPTION 'WCE-06 global Meta rate card is exposed to tenant/public roles';
              END IF;

              IF NOT EXISTS (
                SELECT 1 FROM pg_trigger t
                JOIN pg_class c ON c.oid = t.tgrelid
                JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname = 'public'
                  AND c.relname = 'wa_campaign_usage_ledger'
                  AND t.tgname = 'wa_campaign_usage_ledger_immutable_guard'
                  AND NOT t.tgisinternal
              ) THEN
                RAISE EXCEPTION 'WCE-06 append-only usage ledger trigger is missing';
              END IF;

              IF NOT EXISTS (
                SELECT 1 FROM pg_policies
                WHERE schemaname = 'public'
                  AND tablename = 'wa_campaigns'
                  AND policyname = 'wa_campaigns_read_scoped'
              ) OR NOT EXISTS (
                SELECT 1 FROM pg_policies
                WHERE schemaname = 'public'
                  AND tablename = 'wa_campaign_recipients'
                  AND policyname = 'wa_campaign_recipients_read_scoped'
              ) OR NOT EXISTS (
                SELECT 1 FROM pg_policies
                WHERE schemaname = 'public'
                  AND tablename = 'wa_campaign_usage_ledger'
                  AND policyname = 'wa_campaign_usage_read_scoped'
              ) THEN
                RAISE EXCEPTION 'WCE-06 tenant-scoped campaign/recipient/usage policies are missing';
              END IF;
            END IF;

            IF to_regclass('public.wa_guest_portal_sessions') IS NOT NULL THEN
              IF NOT (
                SELECT c.relrowsecurity FROM pg_class c
                WHERE c.oid = 'public.wa_guest_portal_sessions'::regclass
              ) THEN
                RAISE EXCEPTION 'WCE-02 guest portal session RLS is disabled';
              END IF;
            END IF;

            IF to_regclass('public.restaurant_guest_customer_consents') IS NOT NULL THEN
              IF NOT EXISTS (
                SELECT 1 FROM pg_trigger t
                JOIN pg_class c ON c.oid = t.tgrelid
                JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname = 'public'
                  AND c.relname = 'restaurant_guest_customer_consents'
                  AND t.tgname = 'restaurant_guest_customer_consent_immutable_guard'
                  AND NOT t.tgisinternal
              ) THEN
                RAISE EXCEPTION 'WCE-05 append-only consent trigger is missing';
              END IF;
            END IF;

            IF to_regclass('public.wa_campaign_recipients') IS NOT NULL THEN
              IF NOT EXISTS (
                SELECT 1 FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
                WHERE n.nspname = 'public'
                  AND p.proname = 'wa_reconcile_campaign_usage'
                  AND p.prosecdef
                  AND 'search_path=public, pg_temp' = ANY (p.proconfig)
              ) THEN
                RAISE EXCEPTION 'WCE-08 provider usage reconciliation RPC is missing or unsafe';
              END IF;
              IF has_function_privilege('anon', 'public.wa_reconcile_campaign_usage(integer)', 'EXECUTE')
                OR has_function_privilege('authenticated', 'public.wa_reconcile_campaign_usage(integer)', 'EXECUTE')
                OR NOT has_function_privilege('service_role', 'public.wa_reconcile_campaign_usage(integer)', 'EXECUTE') THEN
                RAISE EXCEPTION 'WCE-08 usage reconciliation RPC grants are not service-role-only';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM pg_trigger t
                JOIN pg_class c ON c.oid = t.tgrelid
                JOIN pg_namespace n ON n.oid = c.relnamespace
                JOIN pg_proc p ON p.oid = t.tgfoid
                WHERE n.nspname = 'public'
                  AND c.relname = 'wa_messages'
                  AND t.tgname = 'wa_messages_campaign_delivery_reconcile'
                  AND NOT t.tgisinternal
                  AND p.prosecdef
                  AND 'search_path=public, pg_temp' = ANY (p.proconfig)
              ) THEN
                RAISE EXCEPTION 'WCE-08 campaign delivery reconciliation trigger is missing or unsafe';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM pg_constraint
                WHERE conrelid = 'public.wa_campaign_recipients'::regclass
                  AND conname = 'wa_campaign_recipients_message_scope_fkey'
              ) THEN
                RAISE EXCEPTION 'WCE-08 campaign recipient message tenant-scope FK is missing';
              END IF;
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_attribute
              WHERE attrelid = 'public.commercial_ai_usage_log'::regclass
                AND attname = 'source_channel'
                AND NOT attisdropped
            ) OR NOT EXISTS (
              SELECT 1 FROM pg_attribute
              WHERE attrelid = 'public.commercial_ai_usage_log'::regclass
                AND attname = 'estimated_cost_known'
                AND NOT attisdropped
            ) OR NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE schemaname = 'public'
                AND tablename = 'commercial_ai_usage_log'
                AND indexname = 'commercial_ai_usage_log_channel_period_idx'
            ) THEN
              RAISE EXCEPTION 'WCE-08 AI usage channel attribution schema is missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_attribute
              WHERE attrelid = 'public.wa_campaign_usage_ledger'::regclass
                AND attname = 'location_id'
                AND NOT attisdropped
            ) OR NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE schemaname = 'public'
                AND tablename = 'wa_campaign_usage_ledger'
                AND indexname = 'wa_campaign_usage_location_period_idx'
            ) THEN
              RAISE EXCEPTION 'WCE-08 outlet-level campaign usage attribution schema is missing';
            END IF;
          END $verify$;
          SQL
