name: Phase 3 Hybrid Allocation
on:
  pull_request:
    paths:
      - "src/modules/restaurant/costing/**"
      - ".github/workflows/phase3-hybrid-allocation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  allocation-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run Phase 3 allocation tests
        run: bunx vitest run src/modules/restaurant/costing/hybrid-allocation.test.ts
