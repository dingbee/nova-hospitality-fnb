name: WCE Source Formatting

on:
  push:
    branches:
      - "wce/wce-06-campaign-commercial-controls"

permissions:
  contents: write
  actions: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wce/wce-06-campaign-commercial-controls
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format WCE-06 changed source
        run: >-
          bunx prettier --write
          src/modules/messaging/campaign-governance.server.ts
          src/modules/messaging/campaign-governance.server.test.ts
          src/modules/messaging/providers/meta-cloud-api.server.ts
          src/modules/messaging/providers/meta-cloud-api.server.test.ts
          src/modules/messaging/webhook-queue.server.ts
          src/modules/messaging/webhook-queue.server.test.ts
          src/modules/messaging/outbound-queue.server.ts
          src/modules/messaging/outbound-queue.server.test.ts
      - name: Commit formatting and dispatch exact-head WCE verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/messaging/campaign-governance.server.ts \
            src/modules/messaging/campaign-governance.server.test.ts \
            src/modules/messaging/providers/meta-cloud-api.server.ts \
            src/modules/messaging/providers/meta-cloud-api.server.test.ts \
            src/modules/messaging/webhook-queue.server.ts \
            src/modules/messaging/webhook-queue.server.test.ts \
            src/modules/messaging/outbound-queue.server.ts \
            src/modules/messaging/outbound-queue.server.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(wce): format WCE-06 campaign implementation"
            git push origin HEAD:wce/wce-06-campaign-commercial-controls
          fi
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dingbee/nova-hospitality-fnb/actions/workflows/wce-ci.yml/dispatches \
            -d '{"ref":"wce/wce-06-campaign-commercial-controls"}'
